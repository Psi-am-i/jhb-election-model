# joburg.whysoserious.org — static-assets Worker (not Pages; see the
# run-analysis precedent: the account token has Workers:Edit, Pages:Read).
# Build ./site with `python src/build_site.py`, then `npx wrangler deploy`.
#
# ⚠️ If a CLOUDFLARE_API_TOKEN env var is present it may be a stale
# placeholder — deploy with `env -u CLOUDFLARE_API_TOKEN npx wrangler deploy`
# to use the OAuth session instead.
#
# UAT is a Version URL of THIS Worker: `versions upload`, check the printed
# *.workers.dev URL, then `versions deploy <id>@100%` promotes those exact
# bytes. Runbook: docs/DEPLOY-UAT.md.

name = "joburg-whysoserious"
compatibility_date = "2026-08-01"
workers_dev = true
# Version URLs (<version-prefix>-joburg-whysoserious.<sub>.workers.dev) are the
# UAT path. Stated, not left to the wrangler-version-dependent default. Must
# sit above every [table] header, like routes below.
preview_urls = true

# Custom domain: joburg.whysoserious.city (zone registered 2026-08-04 for
# this purpose; the earlier .org plan was dropped — that domain's DNS lives
# at GoDaddy, not on this Cloudflare account). DNS record and certificate
# are automatic once the zone is active on the account.
# NOTE: routes must sit ABOVE any [table] header or it becomes e.g.
# assets.routes and is silently ignored (that happened; see git history).
routes = [
  { pattern = "joburg.whysoserious.city", custom_domain = true },
  { pattern = "whysoserious.city", custom_domain = true },
  { pattern = "www.whysoserious.city", custom_domain = true }
]
# Each new city needs its own custom_domain entry here AND a DNS record;
# a wildcard route would not get a certificate on a custom domain.

# A Worker (not assets-only) so hostnames can be routed to per-city
# directories — static assets cannot rewrite by host. See src/worker.js.
main = "src/worker.js"

# Runs before every `wrangler deploy` / `versions upload`: refuses a site whose
# numbers were not reviewed. Preview: JHB_PREVIEW=1. See src/deploy_check.py.
[build]
command = ".venv/bin/python src/deploy_check.py --city joburg"

[assets]
directory = "./site"
binding = "ASSETS"
# Without this the platform serves a matching asset BEFORE the Worker runs,
# so "/" resolves straight to index.html and the hostname routing never
# executes. Found the hard way: the apex kept serving the Joburg forecast.
run_worker_first = true

# Workers Logs: counts the {event: "arrival", channel, host} objects that
# src/worker.js writes for the channel short paths (/go, /x, /li, /fb, /ig, /g),
# and the {event: "arrival", channel: "share", host, via} objects that
# src/share-edge.js writes for a shared forecast's /s/ link.
[observability]
enabled = true

# No per-request record: only the arrival objects above, plus errors and
# uncaught exceptions, are kept. docs-public/privacy.md states this; change the
# two together. Cloudflare, developers.cloudflare.com/workers/observability/
# logs/workers-logs/ (read 2026-10-01):
#   "Invocation logs can be disabled in wrangler by adding the
#    `invocation_logs = false` configuration."
#   "Any `console.log` statements within your Worker will be visible in
#    Workers Logs."
[observability.logs]
invocation_logs = false

# Workers Analytics Engine: one data point per channel arrival (the same events
# as the log objects above), kept longer than Workers Logs' seven days. Written
# by arrival() in src/worker.js; counted with the SQL API (docs/DEPLOY-UAT.md,
# "Counting arrivals"). Holds the channel and the site's hostname only; a
# shared forecast's /s/ arrival (src/share-edge.js) adds the share button used.
# docs-public/privacy.md states both; change them together.
# `[[analytics_engine_datasets]]` is an array-of-tables header of its own, so
# it is top-level wherever it sits; an inline `analytics_engine_datasets = [...]`
# key would have to sit above every [table] header, like routes. Cloudflare
# (read 2026-10-01):
#   developers.cloudflare.com/workers/wrangler/configuration/#analytics-engine-datasets
#     [[analytics_engine_datasets]]
#     binding = "<BINDING_NAME>"
#     dataset = "<DATASET_NAME>"
#   developers.cloudflare.com/analytics/analytics-engine/limits/ (updated 2026-04-23):
#     "Data written to Workers Analytics Engine is stored for three months."
#   developers.cloudflare.com/analytics/analytics-engine/pricing/ (updated 2026-04-23):
#     Workers Paid, data points written: "10 million included per month
#     (+$0.25 per additional million)"; read queries: "1 million included per
#     month (+$1.00 per additional million)".
#     "Currently, you will not be billed for your use of Workers Analytics Engine."
# Version URLs carry this binding too: UAT clicks are written, under their own
# workers.dev host, and the count filters them out by host.
[[analytics_engine_datasets]]
binding = "ARRIVALS"
dataset = "joburg_arrivals"

# The link preview of a shared forecast (src/share-edge.js, src/og-render.js):
# its IBM Plex fonts (src/card-fonts/) are bundled as Data modules. The
# resvg .wasm it imports is compiled at upload by wrangler's default rule.
# resvg-wasm is worker-api's pinned dependency: run `npm ci` in worker-api/
# before deploying, or the bundle cannot resolve it.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = false

# NOT DECLARED YET, on purpose: the seat Worker for link previews. Until
# joburg-seats (worker-api/seats-py) is deployed, a binding to it would fail
# the deploy, and every preview falls back to /og.png. When it exists, the
# owner adds:
#   [[services]]
#   binding = "SEATS"
#   service = "joburg-seats"
# The seal's key is a Worker secret, never a var or a file:
#   wrangler secret put SEAL_KEY      (32 random bytes, generated by the owner)
# Without it, POST /seal/1 answers 503 and no link is sealed.

# Rate limit on POST /seal/1 (src/share-edge.js sealLimited; JUDGEMENT-CALLS.md
# §N9). A Workers Rate Limiting binding needs nothing created: the namespace id
# is this account's own number (worker-api uses 1001 and 1002). Its key is an
# HMAC of the connection's address under SEAL_KEY, so no address is stored,
# and the counter forgets it after the period. Cloudflare (read 2026-10-03):
#   developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
#   period: "10 for ten seconds, 60 for one minute" (the only two allowed).
# Version URLs carry the binding too; they refuse /seal/1 before counting.
[[ratelimits]]
name = "SEAL_LIMIT"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

# NOT DECLARED YET, on purpose: the entries database (owner, 2026-10-03). Each
# successful seal is stored as one row (src/share-edge.js storeEntry; the table
# is migrations/0001_entries.sql), and GET /entries/1/count counts them. Until
# the binding exists no seal is stored and the count answers 503: a forecast
# sealed before then is not an entry. A binding with a made-up id would fail
# the deploy. The owner, from the repository root:
#   npx wrangler d1 create joburg-entries
#   (paste the printed database_id below, and uncomment the four lines)
#   npx wrangler d1 migrations apply joburg-entries --remote
# then deploy as usual (docs/DEPLOY-UAT.md).
# [[d1_databases]]
# binding = "ENTRIES"
# database_name = "joburg-entries"
# database_id = "<the id `wrangler d1 create` printed>"
# migrations_dir = "migrations"
#
# Results night (src/rank_entries.py), once the result is ingested:
#   npx wrangler d1 execute joburg-entries --remote --json --command "SELECT seal_id, sealed_at, label, model_ref, context_ref, state, forecast FROM entries" > ~/joburg-entries.json
# Deletion, 90 days after the leaderboard is published, or within six months
# of polling day if none is (docs-public/privacy.md; JUDGEMENT-CALLS.md §N8):
#   npx wrangler d1 execute joburg-entries --remote --command "DELETE FROM entries"
#   rm ~/joburg-entries.json
#   .venv/bin/python src/rank_entries.py --anonymise     (then build and deploy)
# One entry, on a reader's request (the seal id is the part of the link's s=
# after the dot):
#   npx wrangler d1 execute joburg-entries --remote --command "DELETE FROM entries WHERE seal_id = '<seal id>'"
#   .venv/bin/python src/rank_entries.py --drop <seal id> (once published; then build and deploy)
# At launch, before the first live seal: empty the table of test seals
# (docs/DEPLOY-UAT.md, "Entries at launch"):
#   npx wrangler d1 execute joburg-entries --remote --command "DELETE FROM entries"
