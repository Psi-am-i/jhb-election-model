# joburg.whysoserious.org — static-assets Worker (not Pages; see the
# run-analysis precedent: the account token has Workers:Edit, Pages:Read).
# Build ./site with `python src/build_site.py`, then `npx wrangler deploy`.
#
# ⚠️ If a CLOUDFLARE_API_TOKEN env var is present it may be a stale
# placeholder — deploy with `env -u CLOUDFLARE_API_TOKEN npx wrangler deploy`
# to use the OAuth session instead.

name = "joburg-whysoserious"
compatibility_date = "2026-08-01"
workers_dev = true

# Custom domain: joburg.whysoserious.city (zone registered 2026-08-04 for
# this purpose; the earlier .org plan was dropped — that domain's DNS lives
# at GoDaddy, not on this Cloudflare account). DNS record and certificate
# are automatic once the zone is active on the account.
# NOTE: routes must sit ABOVE any [table] header or it becomes e.g.
# assets.routes and is silently ignored (that happened; see git history).
routes = [
  { pattern = "joburg.whysoserious.city", custom_domain = true },
  { pattern = "whysoserious.city", custom_domain = true },
  { pattern = "www.whysoserious.city", custom_domain = true }
]
# Each new city needs its own custom_domain entry here AND a DNS record;
# a wildcard route would not get a certificate on a custom domain.

# A Worker (not assets-only) so hostnames can be routed to per-city
# directories — static assets cannot rewrite by host. See src/worker.js.
main = "src/worker.js"

[assets]
directory = "./site"
binding = "ASSETS"
# Without this the platform serves a matching asset BEFORE the Worker runs,
# so "/" resolves straight to index.html and the hostname routing never
# executes. Found the hard way: the apex kept serving the Joburg forecast.
run_worker_first = true
