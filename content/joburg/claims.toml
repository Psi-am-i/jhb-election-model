# Claims tested — one entry per public, checkable statement.
# The newsdesk proposes new entries as a data diff; verdicts require a
# model run, so a human sets them. Numbers use {{registry tokens}}.
#
# A verdict is either settled by fact or arithmetic (FALSE, TRUE) or rated by
# chance on the scale in render_sheet.CHANCE_SCALE. A chance-rated claim names
# the figure it is rated on: `chance = "<name>"` when that figure is the chance
# the claim holds, `chance = "1 - <name>"` when the claim holds where that
# figure's event does not. <name> is a [[name]] the build computes. The build
# refuses a verdict the scale does not give that chance.
#
# `slug` is the claim's own address, /claims/<slug> (src/build_site.py
# claim_pages): lowercase words joined by hyphens, no digits (the address is
# in the page's og:url, which the number scan reads). It is a published
# address: once live, never change it.

[[claim]]
slug = "da-outright-majority"
party = "DA"
party_name = "Democratic Alliance"
chip = "#1B5EA8"
logo = "DA"
quote = """We need 490,000 registered DA voters to go vote DA, if they do that we win an outright majority"""
speaker = "Helen Zille, DA"
outlet = "Business Day, March 2026"
url = "https://www.businessday.co.za/politics/2026-03-01-da-needs-490000-voters-to-win-outright-majority-in-joburg-says-zille/"
verdict = "FALSE"
settled = "arithmetic: the target is half of the wrong total, and the seat law moves the line further (the claim's steps)"
card_reason = "The target is half of the wrong total, and the seat law moves the line further."
tests = "P(DA reaches 136 alone) under a full DA-camp turnout surge"
label = "490,000 DA voters would win the DA an outright majority"
captured = "2026-08-07"
published = "7 August 2026"
since = """The turnout setting this test used is no longer in This Model, so the surge cannot be re-run. In the current forecast, the DA wins a majority on its own in none of the [[n_draws]] simulations. The verdict stands. <span data-asof="2026-10-08">On 8 October Zille repeated the claim, saying "136 seats out of 270" (News24, 9 October 2026).</span> <span data-asof="2026-10-23">Correction, 23 October 2026: step 4 said every other party combined sheds about {{pub0807_claim_others_shed}} votes. With the total frozen, the other parties lose what the DA gains: about {{claim_others_shed}}.</span> <span data-asof="2026-10-23">On 20 October Zille said: "I will repeat this until I am blue in the face: 490 000 people need to vote DA on both ballots. That would give us 136 of the council's 270 seats." (<a href="https://www.news24.com/opinions/analysis/watch-the-system-itself-is-the-corruption-zille-on-cleaning-up-joburg-20261020-1090" target="_blank" rel="noopener">News24, 20 October 2026</a>, interviewed by Ann Bernstein of CDE.)</span> This Model expects a median of [[zille_both_total]] votes on each ballot, so [[zille_both_votes]] is [[zille_both_share]]. The DA reaches [[zille_both_votes]] on both ballots in [[zille_both_reach]] of [[n_draws]] simulations. If the DA did win [[zille_both_share]] that would take some of the ANC's wards."""
intro = """<span data-asof="2026-08-07">When we put the claim through This Model on 7 August 2026 it fell short by {{claim_short_by}} seats at the median. The figures below are from that run. This Model has changed since, and the turnout setting they were measured under no longer exists, so read them as history rather than as today's forecast. The claim also falls at its use of arithmetic.</span>"""
steps = [
  """<span data-asof="2026-08-07">**It is half of the wrong number.** {{claim_zille_votes}} is almost exactly half of the ~{{claim_poll_base}} votes expected in Johannesburg if turnout stays at its record low. If there are more voters, you need half of a bigger number. If all DA members did what Zille wanted, the total number of voters would be ~{{claim_poll_surged}}, and half of that is {{claim_half_surged}} — not {{claim_zille_votes}}.</span>""",
  """<span data-asof="2026-08-07">**They can't reach the higher number.** Push every DA and ActionSA supporter to the highest turnout their areas have ever recorded, {{claim_hi_turnout}}%, and the DA does clear the wrong original target, polling ~{{claim_da_votes_surge}}. But that is still well short of {{claim_half_surged}}.</span>""",
  """<span data-asof="2026-08-07">**Even {{claim_da_share_surged}}% of the vote doesn't buy {{claim_da_share_surged}}% of the seats.** {{claim_da_share_surged}}% would be {{claim_prop_seats}} seats of {{council_size}}. But the excessive-seats law still fires in nine simulations out of ten, handing the ANC every stronghold ward it holds — about {{claim_anc_wards_surged}} wards on an entitlement of about {{claim_anc_entitlement_surged}}. The surplus is deducted from everyone else's column, the biggest slice from the biggest party. So the DA's median lands on {{claim_da_median}} of the {{majority}} needed.</span>""",
  """<span data-asof="2026-08-07">**Could she still be right?** We looked for a reading that works. Her exact words — “We need 490,000 registered DA voters to go vote DA, if they do that we win an outright majority” — never say what total she is measuring against. Against 2021's poll of ~{{claim_poll_2021}} ballots, {{claim_zille_votes}} would be {{claim_490k_of_2021}}%. So the claim is true in exactly one world: the DA doubles its vote while every other party combined sheds about {{pub0807_claim_others_shed}} votes, keeping the voter numbers frozen at the record low. If that happened, is Zille right? Nothing in twenty years of turnout records produces that world — but even assuming it exists, while the ANC holds its ~{{claim_anc_wards_surged}}-ward wall the excessive-seats law means the DA needs about {{claim_vote_share_needed}}% of the vote to reach {{majority}}. So even in that world, it is false. The few simulations where the DA does govern alone are the ones where its surge breaks the wall itself, flipping stronghold wards — in those simulations the ANC falls to ~{{claim_anc_collapse_seats}} seats. To do that, the DA needs to do more than turn out its existing supporters. It needs new ones.</span>""",
]

[[claim]]
slug = "anc-absolute-authority"
party = "ANC"
party_name = "African National Congress"
chip = "#007A4D"
logo = "ANC"
quote = """We want to restore this city. But we can only be able to do so if the people of greater Johannesburg give their organisation, the ANC, absolute authority without any hesitation"""
speaker = "Dickson Masemola, ANC NEC member"
outlet = "Joburg ETC, 13 August 2026"
url = "https://www.joburgetc.com/news/anc-vows-to-restore-joburg-no-turnaround-plan/"
verdict = "NEAR IMPOSSIBLE"
chance = "anc_alone_share"
tests = "P(ANC reaches a majority of council alone)"
label = "The ANC can govern Johannesburg alone again"
captured = "2026-08-13"
published = "26 September 2026"
since = """Since then the ANC reaches a majority on its own in none of the {{n_draws}} simulations. Its best result is [[anc_best]] seats."""
intro = """This is an appeal, not a forecast, so the thing to test is whether the mandate being asked for is available at all. Absolute authority means governing without needing anyone else: {{majority}} of the {{council_size}} seats. In the {{n_draws}} simulations behind today's forecast, the ANC does it in [[anc_alone_count]] of them."""
steps = [
  """The ANC's median is [[anc_median]] seats, against the {{majority}} it would need. Its single best result anywhere in the {{n_draws}} simulations is [[anc_best]], and that simulation is the outer edge of the range, not a likely outcome.""",
  """**Being first is a different question, and that one is open.** The ANC alone has the most seats in [[anc_largest_share]] of simulations, the DA alone in [[da_largest_share]], and two or more parties tie for the most seats in [[largest_tied_share]]. First place is a genuine contest. Sole control is not: no party reaches {{majority}} alone in more than a handful of simulations.""",
  """**The ANC does have routes — they are all coalitions.** With the EFF and MK, its closest partners on this ballot, the three together reach {{majority}} in [[anc_left_share]] of simulations, on a median of [[anc_left_median]] seats. Going the other way — an ANC-led council built with ActionSA, the PA and the smaller parties instead — reaches it in [[anc_side_share]]. These routes and others are open to the ANC. Absolute authority is not.""",
]

[[claim]]
slug = "mk-biggest-party"
party = "MK"
party_name = "uMkhonto weSizwe Party"
chip = "#0B3D2E"
logo = "MK"
quote = """We firmly believe that these polls are underpolling MK Party, just as they did in the 2024 elections. According to us, we are going to be the biggest party in the city"""
speaker = "Bongani Baloyi, MK Party mayoral candidate for Johannesburg"
outlet = "TimesLive, 9 September 2026"
url = "https://www.timeslive.co.za/politics/2026-09-09-mkp-mayoral-hopeful-says-polls-undercounting-grassroots-support/"
verdict = "EXTREMELY UNLIKELY"
chance = "mk_largest_share"
tests = "P(MK wins more seats than any other party)"
label = "MK will be the biggest party in the city"
captured = "2026-09-09"
published = "26 September 2026"
since = """Since then MK is the largest party in [[mk_largest_share]] of simulations. Its median is [[mk_median]] seats and the top of its range [[mk_p95]], against the ANC's [[anc_median]] and the DA's [[da_median]]."""
intro = """Unlike most campaign talk this is a precise, checkable prediction: more seats than anyone else. MK is the largest party in [[mk_largest_share]] of the {{n_draws}} simulations."""
steps = [
  """**The gap is large, not marginal.** MK's median is [[mk_median]] seats of {{council_size}}. Even at the top of its range — [[mk_p95]] seats, a result it beats in only one simulation in twenty — it is short of the ANC's typical [[anc_median]] and the DA's [[da_median]].""",
  """The ANC alone has the most seats in [[anc_largest_share]] of simulations and the DA alone in [[da_largest_share]]. Two or more parties tie for the most seats in [[largest_tied_share]]. Everything else, MK included, shares what is left.""",
  """**The complaint about polls does not reach this forecast.** This Model uses no poll at all. It is built from the record — how this city has voted, and the trajectories we can measure in that record. So the claim that pollsters undercount MK, whether or not it is right, leaves these numbers where they are. To be largest, MK would have to be under-represented in past ballot boxes, not in a survey — a different and much harder argument.""",
]

[[claim]]
slug = "da-coalition-red-lines"
card_test = true
party = "DA"
party_name = "Democratic Alliance"
chip = "#1B5EA8"
logo = "DA"
quote = """We won't go into a coalition with MK, and we will not go into coalition with the EFF. Because our value set is too incompatible. You cannot govern with people who don't share any of your ideology"""
speaker = "Helen Zille, DA"
outlet = "Daily Maverick, 13 September 2026"
url = "https://www.dailymaverick.co.za/article/2026-09-13-zille-draws-coalition-red-lines-as-da-targets-joburg-majority/"
verdict = "VERY LIKELY"
chance = "no_red_share"
tests = "P(a majority exists without the ANC, the EFF and MK)"
label = "A majority without the ANC, the EFF and MK is possible for the DA"
captured = "2026-09-13"
published = "26 September 2026"
since = """Since then the rest of the council, without the ANC, the EFF and MK, clears {{majority}} in [[no_red_share]] of simulations. The DA and the ANC together clear it in [[grand_share]]; the DA with ActionSA and the PA in [[three_share]]. The claim holds with a [[no_red_share]] chance, which the scale calls very likely. <span data-asof="2026-10-23">Correction, 23 October 2026: step 1 called the first route "the whole rest of the council except the ANC". Its figure is the rest of the council without the ANC, the EFF and MK together.</span>"""
intro = """A red line is a choice, so there is nothing here to call true or false. What can be tested is what it costs. Without the ANC, the EFF and MK, the rest of the council still clears {{majority}} in [[no_red_share]] of simulations."""
steps = [
  """**There are three ways to a majority.** The whole rest of the council except the ANC, which clears {{majority}} in [[no_red_share]] of simulations; a deal with the ANC alone, [[grand_share]]; or the narrower option, ActionSA and the PA, [[three_share]].""",
  """**The first assumes the whole rest of the council acting as one,** ActionSA, the PA and several small parties: the most generous and least stable option.""",
  """**The DA and the ANC together clear {{majority}} in [[grand_share]] of simulations.** Neither party has said it wants it, but on this arithmetic it is the most reliable two-party majority in the city.""",
  """**The DA with ActionSA and the Patriotic Alliance reaches {{majority}} in [[three_share]] of simulations.** Across all simulations the three hold a median of [[three_median]] seats; where they reach a majority, a median of [[three_median_when_wins]].""",
  """**The same test applied to the other side:** an ANC-led council excluding the DA, the EFF and MK reaches {{majority}} in [[anc_side_share]] of simulations.""",
]

[[claim]]
slug = "actionsa-soweto"
card_test = true
party = "ASA"
party_name = "ActionSA"
chip = "#2FA79B"
logo = "ASA"
quote = """If she thinks she will win Joburg without the support of Soweto, she must be living in another world"""
speaker = "Herman Mashaba, ActionSA leader and mayoral candidate, of Helen Zille (DA)"
outlet = "Inside Politics, 9 September 2026"
url = "https://insidepolitic.co.za/no-joburg-mayoral-win-without-soweto-says-mashaba-of-zille/"
verdict = "QUITE LIKELY"
chance = "1 - realistic_given_none"
tests = "The chance the DA does not lead a majority with ActionSA and the PA, or with the ANC, when it wins no Soweto ward"
label = "The DA cannot win Joburg without Soweto"
captured = "2026-09-09"
published = "7 October 2026"
since = """Since then the forecast reads the IEC's September roll, and this site counts [[soweto_wards_n]] wards as Soweto. The DA wins none of them in [[soweto_none_share]] of simulations. Without one it governs in [[realistic_given_none]]: with ActionSA and the PA in [[asa_pa_given_none]], with the ANC in [[anc_given_none]]. The claim holds with a [[holds_given_none]] chance, which the scale calls quite likely. <span data-asof="2026-10-23">Correction, 23 October 2026: no ward was added to Soweto. Ward 29 now counts as Soweto because this site now places each voting district wholly in one ward. The report quoted is Inside Politics', of an interview with Inside Metros; the card named Inside Metros.</span> The [[realistic_given_some]] in the third step rests on [[soweto_some_count]] of the [[n_draws]] simulations, too few to give a chance."""
intro = """No party is likely to win a majority on its own: {{p_alone}} chance. So winning Joburg means the DA leading a coalition of at least {{majority}} of {{council_size}} seats. Zille has ruled out the EFF and MK. That leaves three realistic partners: ActionSA with the PA, or the ANC. In 2021 the DA won no Soweto ward and governed only through a {{jhb_2021_coalition_parties}}-party coalition that fell within a year."""
holds_subject = "Mashaba"
requires_at_least = "QUITE LIKELY"
steps = [
  """**Mathematically, the DA can lead a coalition in [[da_small_share]] of simulations.** Most of these depend on many parties staying together, any of which can walk out and bring the coalition down. We do not count them.""",
  """**In [[soweto_none_share]] of simulations the DA wins none of the [[soweto_wards_n]] Soweto wards.** Without a Soweto ward it can still govern in [[realistic_given_none]] of simulations, with ActionSA and the PA or with the ANC: [[asa_pa_given_none]] and [[anc_given_none]] respectively (some simulations allow either).""",
  """**In the [[soweto_some_share]] of simulations where the DA does win a Soweto ward, its chance of governing jumps to [[realistic_given_some]].** These simulations show a strong DA across the whole city: the breakthrough the DA has never achieved, and needs to make inroads.""",
  """**[[holds]]** The DA needs Sowetan support, or partners who have it.""",
  """**What this cannot see.** This Model counts seats, not which parties are willing to work together.""",
]
