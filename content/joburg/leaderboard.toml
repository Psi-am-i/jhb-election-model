# /leaderboard/ (src/build_leaderboard.py): every sealed forecast ranked
# against the result. Hidden until the result is in: with `published = false`
# no page is built and the nav has no entry. On results night the owner runs
# src/rank_entries.py, which writes leaderboard.json beside this file, then
# sets `published = true` and builds the site.
published = false
# How many places the page lists. A reader whose forecast placed lower finds
# it by its link.
top = 50
