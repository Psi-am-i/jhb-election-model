# The home page's headline and the paragraphs under it — the owner's words.
#
# Edit the words freely, here or in edit mode (src/edit_mode.py). Each
# {{lede_…}} is filled in by `render_home.py` from the run and can be kept,
# moved or deleted, never typed over: a figure comes from the run (CLAUDE.md
# §2), and a phrase whose strength depends on a figure ("all but inevitable",
# "too close to call", which party) is chosen by that figure. The list of
# placeholders, what each says and where it comes from, is
# `render_home.LEDE_PLACEHOLDERS`; a placeholder not in it stops the build.
#
# `head` is the headline (<em> marks the emphasised opening). `sub`, `sub2`
# and `sub3` are the three paragraphs under it (owner, 2026-10-25).

[[lede]]
head = """<em>{{lede_coalition}}.</em> The largest party is {{lede_race}}. It is
{{lede_overhang_word}} that the council will not match the vote proportionally."""
sub = """{{lede_wards_open}} is ahead in {{lede_wards_first}} wards,
{{lede_wards_in}}{{lede_close_first}} of them {{lede_wards_lead}}{{lede_not_safe}}.
{{lede_second_cap}} is ahead in {{lede_wards_second}} wards{{lede_wards_only}}
{{lede_close_second}} {{lede_wards_that}}{{lede_not_safe}}. Chance of one party
winning outright: {{lede_p_alone}}."""
sub2 = """Proportional representation is designed to give each party seats that match
their support. Direct representation lets voters elect a specific person to
represent them. Our local government elections are a mix of both: we directly
elect ward councillors and then each party is allocated additional seats so that
each party's percentage of the council matches their percentage of the vote.
There is an edge case where this doesn't happen."""
sub3 = """A ward you win cannot be taken away, so a party that wins many wards can end
up with more council seats than its share of the vote should allow. This Model
gives {{lede_overhang_article}} {{lede_p_overhang}} chance of this happening with
{{lede_overhang_party}} this year. It forecasts that they will hold about
{{lede_overhang_seats}} of the seats with only {{lede_overhang_votes}} of the
vote."""

# The introduction under the headline (owner-approved 2026-10-10;
# audits/2026-10-09-site-batch/RELEASE-BRIEF.md, addendum item 3): what the
# site is and how the model works. `paragraphs` are written into the page by
# `render_home._intro`, in order. A {{token}} here is a registry token
# (content/joburg/stats.toml), resolved by the build like any on the page;
# never type a figure.
[intro]
heading = "What this is"
paragraphs = [
"""An unaffiliated forecast of Johannesburg's council election, built from primary
sources. It starts from each voting district's history: past results, turnout,
census data and each party's trajectory. From there it builds the city up from
its wards, rather than applying generalisations down.""",
"""This Model simulates the election thousands of times. Each simulation uses
different values for turnout and for every party's support, each drawn from how
far turnout and parties have moved in past elections.""",
"""It uses as few judgement calls as possible. Each one is listed, with its
evidence, on the <a href="methodology#the-judgement-calls">judgement calls</a>
page, and several can be changed on <a href="your-forecast/">your prediction</a>.""",
]
