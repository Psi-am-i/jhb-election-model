# The Johannesburg stat registry — see src/stats.py for the contract.
#
#   mode = "free"   recomputed from the current model outputs every build
#   mode = "fixed"  pinned to the run that produced it, because it sits
#                   inside a dated argument; the build reports drift
#
# Every entry carries its source and the date it entered the prose.
# An unresolved token fails the build. Drift only warns.

# ---------------------------------------------------------------------------
# free — what the model says now
# ---------------------------------------------------------------------------

