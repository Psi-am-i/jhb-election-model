# --- build-time audit -------------------------------------------------------
# Every model figure and every model claim must either be a {{token}}, so its
# provenance travels to the reader and drift is reported, or be excused here.
# `allow` entries are CONTEXT SUBSTRINGS, not values: whitelisting "23" would
# excuse every 23 on the site, whitelisting "Laingsburg" excuses the one figure
# that is a matter of record.
#
# Only three things belong here, and none of them can go stale:
#   historical fact   what happened, from the IEC record
#   the rules         how the electoral system works
#   reviewed prose    a human decided it should stay static
unverifiable = "arithmetic on two published figures, not a quantity the model emits"
[audit]
allow = [
  "Laingsburg",                    # 2021 result, IEC record
  "ActionSA went from nothing",    # 2021 result, IEC record
  "needs no majority",             # describes the ward rule
  "no majority needed",            # ditto
  "would govern together",         # explicitly a disclaimer, not a forecast
  "will govern with whom",         # ditto — methodology, defining what a pool is NOT
  # Published election results and published poll numbers are external facts,
  # not model outputs. The audit cannot tell them apart, and tokenising them
  # would imply this model produced them.
  "it polled",                     # ActionSA's own 2021 result, IEC record
  "nationally in 2024",            # and its own 2024 national result, IEC record
  "one house had",                 # SRF and Ipsos published poll numbers, POLLING.md
  "another had the ANC on",        # ditto, the second house in the same sentence
  # ADDED 2026-08-30, after the audit was read to the bottom for the first time.
  # It reported 45 unsourced figures; 41 sat inside machine-owned marker blocks
  # that regenerate every build, and only FOUR were hand-typed prose. One of the
  # four was a real defect — "The 87% for ANC+DA", 29 points wrong, now the
  # token {{p_anc_da}}. These are the other three, and each is allowed for a
  # stated reason rather than because it was noisy. MODEL-LOG §1.140.
  "arriving from nowhere to take", # ActionSA's 2021 result, IEC record — a fact
                                   #   about the past, which cannot go stale
  "never means a vote share",      # the glossary's own illustration of what a
                                   #   percentage on this page does NOT mean;
                                   #   an example, not a figure
  "the middle 90%",                # a stated reporting convention (the band the
                                   #   charts draw), not a model output
]

