# --- build-time audit -------------------------------------------------------
# Every model figure and every model claim must either be a {{token}}, so its
# provenance travels to the reader and drift is reported, or be registered here.
#
# `[[audit.fixed]]` clears a NUMBER: its value, the phrase it must sit inside,
# its kind, its source, and the page(s) it is on. `[[audit.allow]]` excuses a
# CLAIM IN WORDS ("nobody will win Johannesburg") and clears no number at all.
#
# ⛔ `page` IS REQUIRED AND IS ENFORCED (owner's sweep, 2026-10-03). It is the
# output path(s) the entry clears, comma-separated, or "*" for every page (the
# footer). `stats.load_audit_config` refuses an entry without one and
# `stats.for_page` applies an entry only on the pages it lists. Until then the
# field was ignored: the 8 August article moved to nobody-will-win.html and
# entries naming index.html went on clearing it, and the allow phrase
# "arriving from nowhere to take" cleared ActionSA's 18% with no source.
#
# Only three things belong here, and none of them can go stale:
#   historical fact   what happened, from the IEC record
#   the rules         how the electoral system works
#   reviewed prose    a human decided it should stay static
