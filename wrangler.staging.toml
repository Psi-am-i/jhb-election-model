# UAT / staging Worker for joburg.whysoserious.city. Same src/worker.js, same
# ./site build, separate Worker name, so a deploy here cannot touch live.
#
#   env -u CLOUDFLARE_API_TOKEN npx wrangler deploy --config wrangler.staging.toml
#
# A separate file rather than [env.staging] in wrangler.toml: wrangler does not
# inherit top-level `routes`, `vars` or `[assets]` into an environment, so an
# env block that omits one deploys quietly without it (archive/superseded-
# docs/EXPANSION.md, "Staging (decided 2026-08-07)"). Here every key is stated.
# tests/test_worker_routing.py checks this file against wrangler.toml.
#
# STAGING = "1" makes src/worker.js serve Johannesburg on every hostname and
# send X-Robots-Tag: noindex, nofollow on every response.

name = "joburg-whysoserious-staging"
compatibility_date = "2026-08-01"
# Setting `routes` turns the workers.dev URL off unless this is explicit.
workers_dev = true
# Stated, not left to the wrangler-version-dependent default.
preview_urls = true

# NOTE: routes must sit ABOVE any [table] header (see wrangler.toml).
# The zone is on this account, so the first deploy creates the DNS record and
# certificate. It fails if a DNS record named uat-joburg already exists.
routes = [
  { pattern = "uat-joburg.whysoserious.city", custom_domain = true }
]

main = "src/worker.js"

[vars]
STAGING = "1"

# The same number-review gate as live. A build whose review is not clear can
# still go to staging with JHB_PREVIEW=1 set in the shell (src/deploy_check.py).
[build]
command = ".venv/bin/python src/deploy_check.py --city joburg"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = true
